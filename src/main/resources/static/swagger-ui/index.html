<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product API - Swagger UI</title>
    <link rel="stylesheet" href="/webjars/swagger-ui/5.33.2/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="/webjars/swagger-ui/5.33.2/swagger-ui-bundle.js"></script>
<script src="/webjars/swagger-ui/5.33.2/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = () => SwaggerUIBundle({
        url: '/openapi/openapi3.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout'
    });
</script>
</body>
</html>
